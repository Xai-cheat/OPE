name: Build Ope
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q -o ope-android.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        working-directory: ope-android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee ../build.log
      - name: Show errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A3 build.log | head -80 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp ope-android/app/build/outputs/apk/debug/app-debug.apk Ope.apk
          gh release create "build-${{ github.run_number }}" Ope.apk --title "Ope build ${{ github.run_number }}" --notes "Debug APK"
